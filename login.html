
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FixABairro - Faça login para gerenciar problemas e ajudar sua comunidade.">
  <meta name="keywords" content="fixabairro, angola, login, entrar, conta, email, telefone, google">
  <meta name="author" content="FixABairro Team">
  <title>FixABairro | Entrar</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts: Inter para corpo, Montserrat para títulos -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (direto do CDN para simplicidade) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    @layer base {
      :root {
        --color-primary-500: #10B981; /* Esmeralda para destaque */
        --color-primary-600: #059669; /* Esmeralda mais escuro */
        --color-accent-500: #FCD34D; /* Amarelo para ícones e avisos */
        --color-accent-600: #FBBF24;
        --color-text-light: #F3F4F6; /* Texto claro */
        --color-text-dark: #1F2937; /* Texto escuro */
        --color-bg-dark: #111827; /* Fundo muito escuro */
        --color-card-bg: #1F2937; /* Fundo do card */
        --color-input-bg: #374151; /* Fundo do input */
        --color-border: #4B5563; /* Borda de inputs */
        --color-error: #EF4444; /* Vermelho de erro */
      }
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, var(--color-bg-dark) 0%, #1F2937 100%);
        color: var(--color-text-light);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Montserrat', sans-serif;
        color: var(--color-text-light);
      }

      /* Animação de fundo sutil */
      .animate-gradient {
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--color-bg-dark); }
      ::-webkit-scrollbar-thumb { background: var(--color-primary-500); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--color-primary-600); }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              500: 'var(--color-primary-500)',
              600: 'var(--color-primary-600)',
            },
            accent: {
              500: 'var(--color-accent-500)',
              600: 'var(--color-accent-600)',
            },
            text: {
              light: 'var(--color-text-light)',
              dark: 'var(--color-text-dark)',
            },
            bg: {
              dark: 'var(--color-bg-dark)',
            },
            card: {
              bg: 'var(--color-card-bg)',
            },
            input: {
              bg: 'var(--color-input-bg)',
            },
            border: {
              DEFAULT: 'var(--color-border)',
            },
            error: 'var(--color-error)',
          },
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            montserrat: ['Montserrat', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>
<body class="animate-gradient transition-all duration-500">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-card-bg rounded-2xl shadow-xl p-8 border border-gray-700 transition-all duration-300 hover:shadow-2xl hover:border-primary-500" data-aos="fade-up" data-aos-duration="1000">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-primary-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg transform transition-transform duration-300 hover:scale-110">
          <i class="fas fa-sign-in-alt text-4xl text-white"></i> <!-- Novo ícone para login -->
        </div>
        <h1 class="text-3xl font-montserrat font-extrabold text-white">Bem-vindo(a) de Volta!</h1>
        <p class="text-gray-400 mt-2 text-md">Entre na sua conta para continuar a sua jornada no FixABairro.</p>
      </div>
      
      <form id="loginForm" class="space-y-6">
        <div>
          <label for="emailOrPhone" class="block text-gray-300 text-sm font-medium mb-2">Email ou Número de Telefone</label>
          <input type="text" id="emailOrPhone" class="w-full p-3 rounded-xl bg-input-bg border border-border text-text-light placeholder-gray-500 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200" placeholder="Ex: seu.email@exemplo.com ou +244XXXXXXXXX" required>
          <p id="emailOrPhoneError" class="text-error text-sm mt-1 hidden"></p>
        </div>
        
        <div>
          <label for="password" class="block text-gray-300 text-sm font-medium mb-2">Senha</label>
          <input type="password" id="password" class="w-full p-3 rounded-xl bg-input-bg border border-border text-text-light placeholder-gray-500 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all duration-200" placeholder="Digite sua senha" required>
          <p id="passwordError" class="text-error text-sm mt-1 hidden"></p>
        </div>
        
        <div class="text-right text-sm">
          <a href="#" id="forgotPassword" class="text-primary-500 hover:underline font-medium transition-all duration-200">Esqueceu a senha?</a>
        </div>
        
        <button type="submit" id="loginBtn" class="w-full bg-primary-500 text-white p-3 rounded-xl font-semibold text-lg hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 focus:ring-offset-card-bg transition-all duration-200 shadow-md transform hover:-translate-y-1">
          <span id="loginText">Entrar</span>
          <span id="loginSpinner" class="hidden spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span>
        </button>
      </form>
      
      <div class="relative flex py-5 items-center">
        <div class="flex-grow border-t border-gray-700"></div>
        <span class="flex-shrink mx-4 text-gray-500 text-sm">OU</span>
        <div class="flex-grow border-t border-gray-700"></div>
      </div>

      <button type="button" id="googleLoginBtn" class="w-full flex items-center justify-center p-3 rounded-xl border border-gray-700 bg-input-bg text-white font-semibold text-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 focus:ring-offset-card-bg transition-all duration-200 shadow-md transform hover:-translate-y-1">
        <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo" class="w-6 h-6 mr-3">
        <span>Entrar com Google</span>
      </button>
      
      <p class="text-center text-gray-400 text-sm mt-6">
        Não tem uma conta? 
        <a href="register.html" class="text-primary-500 hover:underline font-medium">Crie sua conta aqui!</a>
      </p>

      <!-- reCAPTCHA container, will be hidden -->
      <div id="recaptcha-container" class="mt-4"></div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- AOS Animation -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- SEU Firebase Auth Module -->
  <script src="js/firebaseAuth.js"></script>

  <script>
    // Inicialização do AOS
    window.addEventListener('load', () => {
      AOS.init({
        duration: 800,
        easing: 'ease-in-out',
        once: true
      });
    });

    // Configuração do Firebase (SUBSTITUA PELAS SUAS CREDENCIAIS REAIS)
    const firebaseConfig = {
      apiKey: "AIzaSyDVtY6ML3j-qrIsAprIJPB5xFFCbcf4UQw",
      authDomain: "facilita-479b3.firebaseapp.com",
      projectId: "facilita-479b3",
      storageBucket: "facilita-479b3.appspot.com",
      messagingSenderId: "385676676886",
      appId: "1:385676676886:web:6976de7f3abc6c0da94a37"
    };

    // Inicializa Firebase após o carregamento dos SDKs
    let firebaseApp;
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebaseApp = firebase.initializeApp(firebaseConfig);
      } else if (firebase.apps.length) {
        firebaseApp = firebase.app();
      }
      // reCAPTCHA é inicializado dinamicamente no firebaseAuth.js
    });

    // Elementos DOM
    const loginForm = document.getElementById('loginForm');
    const emailOrPhoneInput = document.getElementById('emailOrPhone');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginSpinner = document.getElementById('loginSpinner');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const forgotPasswordLink = document.getElementById('forgotPassword');
    const emailOrPhoneError = document.getElementById('emailOrPhoneError');
    const passwordError = document.getElementById('passwordError');

    // Manipulador do formulário de login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Limpar mensagens de erro
      emailOrPhoneError.classList.add('hidden');
      passwordError.classList.add('hidden');

      let isValid = true;
      const emailOrPhone = emailOrPhoneInput.value.trim();
      const isEmail = emailOrPhone.includes('@');
      const isPhone = /^\+244\d{9}$/.test(emailOrPhone); // Formato +244XXXXXXXXX

      if (!emailOrPhone) {
        emailOrPhoneError.textContent = "Email ou número de telefone é obrigatório.";
        emailOrPhoneError.classList.remove('hidden');
        isValid = false;
      } else if (!isEmail && !isPhone) {
        emailOrPhoneError.textContent = "Formato inválido. Use um email ou +244XXXXXXXXX.";
        emailOrPhoneError.classList.remove('hidden');
        isValid = false;
      }

      if (!passwordInput.value) {
        passwordError.textContent = "A senha é obrigatória.";
        passwordError.classList.remove('hidden');
        isValid = false;
      }

      if (!isValid) {
        return;
      }

      // Mostrar estado de carregamento
      loginBtn.disabled = true;
      loginText.classList.add('hidden');
      loginSpinner.classList.remove('hidden');
      loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> A entrar...`;


      try {
        if (typeof firebaseAuth === 'undefined') {
          throw new Error("Módulo firebaseAuth não carregado. Verifique js/firebaseAuth.js ou a ordem de carregamento.");
        }

        if (isEmail) {
          await firebaseAuth.loginWithEmail(emailOrPhone, passwordInput.value, firebaseApp);
          alert('Login com email realizado com sucesso! Bem-vindo(a) de volta ao FixABairro.');
          window.location.href = 'profile.html'; // Redireciona para o perfil
        } else if (isPhone) {
          // Armazenar o número de telefone para a próxima tela
          localStorage.setItem('pendingVerificationPhoneNumber', emailOrPhone);
          
          await firebaseAuth.sendVerificationCode(emailOrPhone, firebaseApp, 'recaptcha-container'); 
          
          alert('Um código de verificação foi enviado para o seu telefone. Por favor, verifique-o.');
          window.location.href = 'verify-phone.html'; // Redireciona para tela de verificação de OTP
        }
      } catch (error) {
        let errorMessage = "Erro ao fazer login. Por favor, tente novamente.";
        if (error.code) {
            switch (error.code) {
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential': 
                    errorMessage = 'Email/telefone ou senha incorretos.';
                    if (!isEmail) { // Se for telefone, mas não está no formato
                      emailOrPhoneError.textContent = errorMessage;
                      emailOrPhoneError.classList.remove('hidden');
                    } else { // Se for email
                      emailOrPhoneError.textContent = errorMessage;
                      emailOrPhoneError.classList.remove('hidden');
                    }
                    break;
                case 'auth/invalid-email':
                    errorMessage = 'O formato do email é inválido.';
                    emailOrPhoneError.textContent = errorMessage;
                    emailOrPhoneError.classList.remove('hidden');
                    break;
                case 'auth/invalid-phone-number':
                    errorMessage = 'O número de telefone fornecido é inválido.';
                    emailOrPhoneError.textContent = errorMessage;
                    emailOrPhoneError.classList.remove('hidden');
                    break;
                case 'auth/too-many-requests':
                    errorMessage = 'Muitas tentativas de login. Sua conta pode ter sido temporariamente bloqueada.';
                    break;
                case 'auth/network-request-failed':
                    errorMessage = 'Erro de rede. Verifique sua conexão à internet.';
                    break;
                default:
                    errorMessage = `Erro: ${error.message}`;
                    alert(errorMessage);
            }
        } else {
            errorMessage = error.message;
            alert(errorMessage);
        }
        console.error("Erro ao fazer login:", error);
      } finally {
        loginBtn.disabled = false;
        loginText.classList.remove('hidden');
        loginSpinner.classList.add('hidden');
        loginBtn.innerHTML = `Entrar`;
      }
    });

    // Login com Google
    googleLoginBtn.addEventListener('click', async () => {
      // Mostrar estado de carregamento para o botão Google
      googleLoginBtn.disabled = true;
      googleLoginBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> A entrar...`;

      try {
        if (typeof firebaseAuth === 'undefined') {
          throw new Error("Módulo firebaseAuth não carregado. Verifique js/firebaseAuth.js ou a ordem de carregamento.");
        }
        await firebaseAuth.loginWithGoogle(firebaseApp, 'recaptcha-container'); // Passa o container do reCAPTCHA
        alert('Login com Google realizado com sucesso! Bem-vindo(a) ao FixABairro.');
        window.location.href = 'profile.html';
      } catch (error) {
        let errorMessage = "Erro ao fazer login com Google. Por favor, tente novamente.";
        if (error.code) {
            switch (error.code) {
                case 'auth/popup-closed-by-user':
                    errorMessage = 'A janela de login do Google foi fechada.';
                    break;
                case 'auth/cancelled-popup-request':
                    errorMessage = 'Requisição de popup cancelada.';
                    break;
                case 'auth/network-request-failed':
                    errorMessage = 'Erro de rede. Verifique sua conexão à internet.';
                    break;
                default:
                    errorMessage = `Erro: ${error.message}`;
            }
        } else {
            errorMessage = error.message;
        }
        alert(errorMessage);
        console.error("Erro ao fazer login com Google:", error);
      } finally {
        googleLoginBtn.disabled = false;
        googleLoginBtn.innerHTML = `<img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo" class="w-6 h-6 mr-3"><span>Entrar com Google</span>`;
      }
    });

    // Esqueceu a senha
    forgotPasswordLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const emailInputVal = emailOrPhoneInput.value.trim();
      if (!emailInputVal || !emailInputVal.includes('@')) {
        alert('Por favor, digite seu email no campo "Email ou Número de Telefone" para redefinir a senha.');
        return;
      }
      try {
        if (typeof firebaseAuth === 'undefined') {
          throw new Error("Módulo firebaseAuth não carregado. Verifique js/firebaseAuth.js ou a ordem de carregamento.");
        }
        await firebaseAuth.resetPassword(emailInputVal, firebaseApp);
        alert('Um email para redefinição de senha foi enviado para ' + emailInputVal + '. Verifique sua caixa de entrada.');
      } catch (error) {
        let errorMessage = "Erro ao resetar senha. Por favor, tente novamente.";
        if (error.code) {
            switch (error.code) {
                case 'auth/user-not-found':
                    errorMessage = 'Não há conta com este email.';
                    break;
                case 'auth/invalid-email':
                    errorMessage = 'O formato do email é inválido.';
                    break;
                case 'auth/network-request-failed':
                    errorMessage = 'Erro de rede. Verifique sua conexão à internet.';
                    break;
                default:
                    errorMessage = `Erro: ${error.message}`;
            }
        } else {
            errorMessage = error.message;
        }
        alert(errorMessage);
        console.error("Erro ao resetar senha:", error);
      }
    });
  </script>
</body>
</html>
