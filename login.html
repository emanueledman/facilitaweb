<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FixABairro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary': '#4F46E5', // Azul índigo vibrante
                        'primary-dark': '#4338CA', // Versão mais escura do primário
                        'secondary': '#6B7280', // Cinza neutro
                        'success': '#10B981', // Verde para sucesso
                        'error': '#EF4444', // Vermelho para erro
                        'text-primary': '#1F2937', // Texto principal escuro
                        'text-secondary': '#4B5563', // Texto secundário
                        'bg-light': '#F9FAFB', // Fundo claro
                        'border-light': '#E5E7EB', // Borda clara
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.bg-light');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container-wrapper {
            max-width: 450px; /* Largura otimizada para login */
            width: 100%;
            background-color: #ffffff;
            padding: 2.5rem; /* Padding generoso */
            border-radius: 1.5rem; /* Cantos bem arredondados */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15); /* Sombra suave e profunda */
            border: 1px solid theme('colors.border-light');
            animation: fadeIn 0.8s ease-out; /* Animação de fade-in */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
            border: 1px solid theme('colors.border-light');
            border-radius: 0.75rem; /* Cantos arredondados */
            padding: 0.875rem 1.25rem; /* Padding confortável */
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fcfcfc; /* Levemente cinza */
        }
        input:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); /* Sombra de foco com cor primária */
        }
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem 1.5rem; /* Mais padding para botões */
            border-radius: 0.75rem; /* Cantos arredondados */
            font-weight: 700; /* Mais negrito */
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1); /* Sombra de texto sutil */
        }
        button:hover:not(:disabled) {
            transform: translateY(-3px); /* Efeito de levantamento mais pronunciado */
            box-shadow: 0 8px 15px rgba(0,0,0,0.15); /* Sombra ao hover */
        }
        button:active:not(:disabled) {
            transform: translateY(0); /* Efeito de clique */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: theme('colors.primary');
            color: white;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .btn-primary:hover:not(:disabled) {
            background-color: theme('colors.primary-dark');
        }
        .btn-google {
            background-color: #DB4437; /* Cor do Google */
            color: white;
            box-shadow: 0 4px 10px rgba(219, 68, 55, 0.2);
        }
        .btn-google:hover:not(:disabled) {
            background-color: #C23321;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 1.25rem; /* Tamanho maior para o spinner */
            height: 1.25rem;
            animation: spin 1s linear infinite;
            margin-right: 0.75rem; /* Mais espaço */
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            color: theme('colors.error');
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
        .border-error {
            border-color: theme('colors.error') !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2) !important;
        }
        .message-box {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffffff;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 1000;
            min-width: 320px; /* Largura mínima para notificações */
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
        }
        .message-box.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .message-box.success {
            border: 1px solid theme('colors.success');
            color: #065F46; /* Cor de texto mais escura para contraste */
            background-color: #ECFDF5; /* Fundo verde claro */
        }
        .message-box.error {
            border: 1px solid theme('colors.error');
            color: #991B1B; /* Cor de texto mais escura para contraste */
            background-color: #FEF2F2; /* Fundo vermelho claro */
        }
        .message-box .icon {
            font-size: 1.75rem; /* Ícone maior */
        }
        .message-box.success .icon {
            color: theme('colors.success');
        }
        .message-box.error .icon {
            color: theme('colors.error');
        }
    </style>
</head>
<body>
    <div class="container-wrapper">
        <h2 class="text-3xl font-extrabold text-center text-text-primary mb-8">Bem-vindo(a) de Volta!</h2>
        <p class="text-center text-text-secondary mb-8">Faça login para continuar.</p>

        <form id="loginForm" class="space-y-6">
            <!-- Campo Email ou Telefone -->
            <div>
                <label for="emailOrPhone" class="block text-sm font-medium text-text-secondary mb-2">Email ou Número de Telefone (+2449XXXXXXXX)</label>
                <input type="text" id="emailOrPhone" placeholder="seu.email@exemplo.com ou +244912345678" required autocomplete="username">
                <p id="emailOrPhoneError" class="error-message">Formato inválido. Use um email ou +2449XXXXXXXX.</p>
            </div>

            <!-- Campo Senha -->
            <div>
                <label for="password" class="block text-sm font-medium text-text-secondary mb-2">Senha</label>
                <input type="password" id="password" placeholder="Sua senha secreta" required autocomplete="current-password">
                <p id="passwordError" class="error-message">A senha é obrigatória e deve ter pelo menos 8 caracteres.</p>
            </div>

            <!-- Link Esqueceu a Senha -->
            <div class="text-right">
                <a href="#" id="forgotPassword" class="text-sm font-medium text-primary hover:underline">Esqueceu a senha?</a>
            </div>

            <!-- Botão de Login -->
            <button type="submit" id="loginBtn" class="btn-primary">
                <span id="loginText"><i class="fas fa-sign-in-alt mr-3"></i> Entrar</span>
                <span id="loginSpinner" class="spinner hidden"></span>
            </button>
        </form>

        <div class="relative flex items-center justify-center my-6">
            <div class="w-full border-t border-border-light"></div>
            <span class="absolute px-3 bg-white text-text-secondary text-sm">Ou</span>
        </div>

        <!-- Botão de Login com Google -->
        <button type="button" id="googleLoginBtn" class="btn-google">
            <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo" class="w-6 h-6 mr-3">
            <span>Entrar com Google</span>
        </button>

        <p class="mt-8 text-center text-sm text-text-secondary">
            Não tem uma conta? <a href="register.html" class="font-medium text-primary hover:underline">Registe-se aqui</a>
        </p>
    </div>

    <!-- Message Box for Notifications -->
    <div id="notificationMessageBox" class="message-box">
        <i id="notificationIcon" class="icon"></i>
        <span id="notificationMessage"></span>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <!-- IMask.js CDN for input masking -->
    <script src="https://unpkg.com/imask"></script>
    <!-- Inclui o seu arquivo firebaseAuth.js -->
    <script src="firebaseAuth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializa Firebase usando a configuração e o objeto do firebaseAuth.js
            try {
                if (typeof window.firebaseAuth === 'undefined' || typeof window.firebaseConfig === 'undefined') {
                    throw new Error("Erro: firebaseAuth.js ou firebaseConfig não definidos. Verifique a inclusão dos scripts.");
                }
                window.firebaseAuth.initializeFirebaseApp(window.firebaseConfig);
                console.log("Firebase inicializado com sucesso.");
            } catch (error) {
                console.error("Erro ao inicializar Firebase:", error);
                showNotification('error', 'Erro ao carregar o sistema. Tente novamente.');
                return;
            }

            // Verifica o estado de autenticação e redireciona se já estiver logado
            window.firebaseAuth.checkAuthState('dashboard.html', null); // Redireciona para dashboard.html se logado

            // Referências aos elementos da UI
            const loginForm = document.getElementById('loginForm');
            const emailOrPhoneInput = document.getElementById('emailOrPhone');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            const googleLoginBtn = document.getElementById('googleLoginBtn');
            const forgotPasswordLink = document.getElementById('forgotPassword');

            const emailOrPhoneError = document.getElementById('emailOrPhoneError');
            const passwordError = document.getElementById('passwordError');
            const notificationMessageBox = document.getElementById('notificationMessageBox');
            const notificationIcon = document.getElementById('notificationIcon');
            const notificationMessage = document.getElementById('notificationMessage');

            let isSubmitting = false; // Flag para prevenir múltiplos envios

            // Máscara para o campo de email ou telefone (inicia como telefone para Angola)
            const emailOrPhoneMask = IMask(emailOrPhoneInput, {
                mask: [
                    {
                        mask: /^\S+@\S+\.\S+$/, // Regex para email
                        prepare: (value, masked) => value.toLowerCase(), // Converte para minúsculas
                        lazy: true, // Começa sem máscara visível para emails
                        overwrite: true,
                        autofix: true,
                        definitions: {
                            '@': /[a-zA-Z0-9_.-]/, // Caracteres permitidos para email
                        }
                    },
                    {
                        mask: '+244 000 000 000', // Máscara para telefone angolano
                        lazy: false,
                        placeholderChar: '_',
                        prepare: (value, masked) => {
                            if (!value.startsWith('+244')) {
                                return '+244' + value.replace(/[^0-9]/g, '');
                            }
                            return value;
                        }
                    }
                ],
                dispatch: (appended, dynamicMasked) => {
                    // Decide qual máscara aplicar com base na entrada do utilizador
                    if (appended === '@' && dynamicMasked.value.indexOf('@') === -1) {
                        return dynamicMasked.compiledMasks[0]; // Email
                    }
                    if (appended.match(/[a-zA-Z]/)) {
                        return dynamicMasked.compiledMasks[0]; // Email
                    }
                    if (appended.match(/[0-9]/) && dynamicMasked.value.length < 4 && !dynamicMasked.value.startsWith('+244')) {
                        return dynamicMasked.compiledMasks[1]; // Telefone
                    }
                    return dynamicMasked.compiledMasks[1]; // Default para telefone
                }
            });

            // Adiciona um listener para preencher o prefixo quando o campo é focado e vazio
            emailOrPhoneInput.addEventListener('focus', () => {
                if (emailOrPhoneInput.value === '') {
                    emailOrPhoneMask.updateValue('+244', { force: true });
                }
            });

            // Limpa o prefixo se o usuário não digitar mais nada
            emailOrPhoneInput.addEventListener('blur', () => {
                if (emailOrPhoneInput.value === '+244' || emailOrPhoneInput.value.trim() === '') {
                    emailOrPhoneMask.updateValue('');
                    emailOrPhoneMask.updateValue(); // Força a atualização da máscara
                }
            });


            // --- Funções auxiliares para UI ---
            function showNotification(type, message) {
                notificationIcon.className = `icon fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;
                notificationMessageBox.classList.remove('success', 'error');
                notificationMessageBox.classList.add(type);
                notificationMessage.textContent = message;
                notificationMessageBox.classList.add('show');
                setTimeout(() => {
                    hideNotification();
                }, 5000); // Esconde a notificação após 5 segundos
            }

            function hideNotification() {
                notificationMessageBox.classList.remove('show');
            }

            function showError(element, message) {
                element.textContent = message;
                element.style.display = 'block';
                const inputElement = element.parentElement.querySelector('input');
                if (inputElement) {
                    inputElement.setAttribute('aria-invalid', 'true');
                    inputElement.classList.add('border-error');
                }
            }

            function hideError(element) {
                element.style.display = 'none';
                const inputElement = element.parentElement.querySelector('input');
                if (inputElement) {
                    inputElement.setAttribute('aria-invalid', 'false');
                    inputElement.classList.remove('border-error');
                }
            }

            function toggleButtonState(button, textSpan, spinnerSpan, isLoading, defaultTextHtml) {
                if (isLoading) {
                    button.disabled = true;
                    textSpan.classList.add('hidden');
                    spinnerSpan.classList.remove('hidden');
                } else {
                    button.disabled = false;
                    textSpan.classList.remove('hidden');
                    spinnerSpan.classList.add('hidden');
                    button.innerHTML = defaultTextHtml; // Restaura o HTML original do botão
                }
            }

            // Event listener para o envio do formulário de login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (isSubmitting) return;

                isSubmitting = true;
                hideError(emailOrPhoneError);
                hideError(passwordError);
                hideNotification();

                let isValid = true;
                const emailOrPhoneRaw = emailOrPhoneInput.value.trim();
                const password = passwordInput.value;

                // Validação de email/telefone
                const isEmail = window.firebaseAuth.validateEmail(emailOrPhoneRaw) === null;
                const isPhone = window.firebaseAuth.validatePhone(emailOrPhoneRaw) === null;

                if (!emailOrPhoneRaw) {
                    showError(emailOrPhoneError, "Email ou número de telefone é obrigatório.");
                    isValid = false;
                } else if (!isEmail && !isPhone) {
                    showError(emailOrPhoneError, "Formato inválido. Use um email ou +2449XXXXXXXX.");
                    isValid = false;
                }

                // Validação de senha
                const passwordErrorMsg = window.firebaseAuth.validatePassword(password);
                if (passwordErrorMsg) {
                    showError(passwordError, passwordErrorMsg);
                    isValid = false;
                }

                if (!isValid) {
                    isSubmitting = false;
                    return;
                }

                toggleButtonState(loginBtn, loginText, loginSpinner, true, `<i class="fas fa-sign-in-alt mr-3"></i> Entrar`);

                try {
                    if (isEmail) {
                        const result = await window.firebaseAuth.loginWithEmail(emailOrPhoneRaw, password);
                        if (result.requiresEmailVerification) {
                            localStorage.setItem('pendingVerificationEmail', emailOrPhoneRaw); // Guardar email para página de verificação
                            showNotification('success', 'Login realizado! Por favor, verifique seu email.');
                            setTimeout(() => {
                                window.location.href = 'verify-email.html';
                            }, 2000);
                        } else {
                            showNotification('success', 'Login realizado com sucesso!');
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 2000);
                        }
                    } else if (isPhone) {
                        // Para login por telefone, iniciamos o fluxo de envio de código OTP
                        // e redirecionamos para a página de verificação de telefone.
                        // A senha não é usada diretamente neste fluxo de login por telefone (OTP).
                        // O utilizador será autenticado no Firebase Authentication na página verify-phone.html.

                        // O reCAPTCHA Verifier precisa ser inicializado para enviar o código de telefone
                        await window.firebaseAuth.initializeRecaptcha('recaptcha-container-login-page'); // Pode ser um div invisível
                        // Envia o código de verificação. A `confirmationResult` será usada na página de verificação.
                        // Não armazenamos `confirmationResult` no localStorage pois não é serializável.
                        // A página verify-phone.html irá pedir o número novamente para re-iniciar o fluxo de OTP
                        // ou usar o número armazenado temporariamente para isso.
                        
                        // Guardar o número de telefone temporariamente para a página de verificação
                        localStorage.setItem('pendingVerificationPhoneNumber', emailOrPhoneRaw);

                        await window.firebaseAuth.sendPhoneVerificationCode(emailOrPhoneRaw);
                        showNotification('success', 'Código de verificação enviado para o seu telefone.');
                        setTimeout(() => {
                            window.location.href = 'verify-phone.html';
                        }, 2000);
                    }
                } catch (error) {
                    console.error("Erro no login:", error);
                    let userFacingMessage = error.message || 'Erro ao fazer login. Tente novamente.';
                    
                    // Tratamento de erros específicos para campos
                    if (error.code) {
                        switch (error.code) {
                            case 'auth/user-not-found':
                            case 'auth/invalid-email':
                                showError(emailOrPhoneError, 'Utilizador não encontrado ou email inválido.');
                                break;
                            case 'auth/wrong-password':
                                showError(passwordError, 'Senha incorreta.');
                                break;
                            case 'auth/invalid-phone-number':
                                showError(emailOrPhoneError, 'Número de telefone inválido.');
                                break;
                            case 'auth/too-many-requests':
                                showNotification('error', 'Muitas tentativas. Tente novamente mais tarde ou use "Esqueceu a senha?".');
                                break;
                            case 'auth/captcha-check-failed':
                                showNotification('error', 'Falha na verificação de segurança. Tente novamente.');
                                break;
                            case 'auth/network-request-failed':
                                showNotification('error', 'Problema de conexão com a internet. Verifique sua conexão e tente novamente.');
                                break;
                            default:
                                showNotification('error', userFacingMessage);
                        }
                    } else {
                        showNotification('error', userFacingMessage);
                    }
                } finally {
                    toggleButtonState(loginBtn, loginText, loginSpinner, false, `<i class="fas fa-sign-in-alt mr-3"></i> Entrar`);
                    isSubmitting = false;
                }
            });

            // Event listener para o login com Google
            googleLoginBtn.addEventListener('click', async () => {
                hideNotification();
                toggleButtonState(googleLoginBtn, googleLoginBtn.querySelector('span:nth-of-type(2)'), googleLoginBtn.querySelector('.spinner'), true, `<img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo" class="w-6 h-6 mr-3"><span>Entrar com Google</span>`);

                try {
                    await window.firebaseAuth.loginWithGoogle();
                    showNotification('success', 'Login com Google realizado com sucesso!');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } catch (error) {
                    console.error("Erro no login com Google:", error);
                    let userFacingMessage = error.message || 'Erro ao fazer login com Google. Tente novamente.';
                    if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
                        userFacingMessage = "Login com Google cancelado.";
                    } else if (error.code === 'auth/account-exists-with-different-credential') {
                        userFacingMessage = "Já existe uma conta com este email. Faça login com outro método.";
                    }
                    showNotification('error', userFacingMessage);
                } finally {
                    toggleButtonState(googleLoginBtn, googleLoginBtn.querySelector('span:nth-of-type(2)'), googleLoginBtn.querySelector('.spinner'), false, `<img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo" class="w-6 h-6 mr-3"><span>Entrar com Google</span>`);
                }
            });

            // Event listener para "Esqueceu a senha?"
            forgotPasswordLink.addEventListener('click', async (e) => {
                e.preventDefault();
                hideError(emailOrPhoneError);
                hideNotification();

                const emailInputVal = emailOrPhoneInput.value.trim();
                const emailValidationResult = window.firebaseAuth.validateEmail(emailInputVal);
                
                if (!emailInputVal || emailValidationResult) {
                    showError(emailOrPhoneError, emailValidationResult || 'Digite um email válido para redefinir a senha.');
                    return;
                }

                // Desabilita o link temporariamente
                forgotPasswordLink.style.pointerEvents = 'none';
                forgotPasswordLink.textContent = 'Enviando...';

                try {
                    await window.firebaseAuth.resetPassword(emailInputVal);
                    showNotification('success', 'Email para redefinição de senha enviado. Verifique sua caixa de entrada.');
                } catch (error) {
                    console.error("Erro ao resetar senha:", error);
                    showNotification('error', error.message || 'Erro ao redefinir senha. Tente novamente.');
                } finally {
                    // Reabilita o link
                    forgotPasswordLink.style.pointerEvents = 'auto';
                    forgotPasswordLink.textContent = 'Esqueceu a senha?';
                }
            });

            // Div invisível para o reCAPTCHA para o fluxo de login de telefone
            const recaptchaContainerLoginPage = document.createElement('div');
            recaptchaContainerLoginPage.id = 'recaptcha-container-login-page';
            recaptchaContainerLoginPage.classList.add('hidden'); // Garante que é invisível
            document.body.appendChild(recaptchaContainerLoginPage);
        });
    </script>
</body>
</html>
