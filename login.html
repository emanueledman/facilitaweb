<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FixABairro - Login">
  <meta name="keywords" content="fixabairro, angola, serviços públicos, cidadania, login">
  <meta name="author" content="FixABairro Team">
  <title>FixABairro | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <style>
    /* Seu CSS atual */
    :root {
      --primary-color: #1e40af; /* Azul escuro */
      --secondary-color: #22c55e; /* Verde */
      --highlight-color: #f59e0b; /* Amarelo-alaranjado */
      --dark-bg: #1f2937;
      --dark-card: #2d3748;
      --light-text: #f3f4f6;
      --card-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      --border-radius: 12px;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--dark-bg);
      color: var(--light-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .auth-container {
      max-width: 500px;
      width: 100%;
      margin: auto;
      padding: 2rem;
    }
    
    .auth-card {
      background: var(--dark-card);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(34, 197, 94, 0.2);
      transition: transform 0.3s ease;
    }
    
    .auth-card:hover {
      transform: translateY(-5px);
    }
    
    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .auth-logo img {
      width: 60px;
      height: 60px;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.5));
      transition: transform 0.3s ease;
    }
    
    .auth-logo img:hover {
      transform: scale(1.1);
    }
    
    .auth-logo h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(to right, #ffffff, var(--primary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .auth-form .form-control {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--light-text);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      margin-bottom: 1.25rem;
      transition: all 0.3s ease;
    }
    
    .auth-form .form-control:focus {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(34, 197, 94, 0.25);
      color: var(--light-text);
    }
    
    .auth-form .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .auth-form .form-label {
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    
    .btn-auth {
      width: 100%;
      padding: 0.75rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background-color: var(--primary-color);
      border: none;
      box-shadow: 0 4px 8px rgba(34, 197, 94, 0.3);
    }
    
    .btn-primary:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(34, 197, 94, 0.5);
    }
    
    .btn-primary:disabled {
      background-color: #6b7280;
      cursor: not-allowed;
      box-shadow: none;
    }
    
    .btn-outline-light {
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: var(--light-text);
    }
    
    .btn-outline-light:hover {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255, 255, 255, 0.7);
    }
    
    .auth-footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
      color: var(--primary-dark);
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: rgba(255, 255, 255, 0.5);
    }
    
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .divider::before {
      margin-right: 1rem;
    }
    
    .divider::after {
      margin-left: 1rem;
    }
    
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    
    .google-btn img {
      height: 20px;
    }
    
    .error-message {
      color: #ef4444; /* Usar uma cor de erro definida */
      font-size: 0.9rem;
      margin-top: -0.75rem;
      margin-bottom: 1rem;
      display: none;
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-left: 0.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 576px) {
      .auth-container {
        padding: 1.5rem;
      }
      
      .auth-card {
        padding: 1.5rem;
      }
      
      .auth-logo h1 {
        font-size: 1.5rem;
      }
      
      .auth-logo img {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="icons/Icon-192.png" alt="FixABairro Logo">
        <h1>FixABairro</h1>
      </div>
      
      <form id="loginForm" class="auth-form">
        <div class="mb-4">
          <label for="emailOrPhone" class="form-label">Email ou Número de Telefone</label>
          <input type="text" class="form-control" id="emailOrPhone" placeholder="Email ou +244XXXXXXXXX" required>
          <div id="emailOrPhoneError" class="error-message"></div>
        </div>
        
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
          <div id="passwordError" class="error-message"></div>
        </div>
        
        <div class="d-flex justify-content-end mb-4">
          <a href="#" id="forgotPassword" class="text-decoration-none" style="color: var(--primary-color);">Esqueceu a senha?</a>
        </div>
        
        <button type="submit" class="btn btn-primary btn-auth" id="loginBtn">
          <span id="loginText">Entrar</span>
          <span id="loginSpinner" class="spinner" style="display: none;"></span>
        </button>
        
        <div class="divider">ou</div>
        
        <button type="button" class="btn btn-outline-light btn-auth" id="googleLoginBtn">
          <span class="google-btn">
            <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Google Logo">
            <span>Entrar com Google</span>
          </span>
        </button>
        
        <div class="auth-footer">
          Não tem uma conta? <a href="register.html" id="registerLink">Criar conta</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebaseAuth.js"></script>

  <script>
    // Seus elementos DOM e scripts atuais
    const loginForm = document.getElementById('loginForm');
    const emailOrPhoneInput = document.getElementById('emailOrPhone'); // Mudança aqui
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginSpinner = document.getElementById('loginSpinner');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const forgotPasswordLink = document.getElementById('forgotPassword');
    const emailOrPhoneError = document.getElementById('emailOrPhoneError'); // Mudança aqui
    const passwordError = document.getElementById('passwordError');

    // Inicialização do reCAPTCHA (para login por telefone)
    let recaptchaVerifier;
    window.onload = function() {
      // Apenas inicialize o reCAPTCHA se o login por telefone for uma opção primária
      // Ou se você tiver um botão específico para login por telefone
      // É mais comum inicializá-lo ao tentar o login por telefone
    };

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Limpar mensagens de erro
      emailOrPhoneError.style.display = 'none';
      passwordError.style.display = 'none';

      let isValid = true;
      const emailOrPhone = emailOrPhoneInput.value.trim();
      const isEmail = emailOrPhone.includes('@');
      const isPhone = /^\+244\d{9}$/.test(emailOrPhone);

      if (!emailOrPhone) {
        emailOrPhoneError.textContent = "Email ou número de telefone é obrigatório.";
        emailOrPhoneError.style.display = 'block';
        isValid = false;
      } else if (!isEmail && !isPhone) {
        emailOrPhoneError.textContent = "Formato inválido. Use um email ou +244XXXXXXXXX.";
        emailOrPhoneError.style.display = 'block';
        isValid = false;
      }

      if (!passwordInput.value) {
        passwordError.textContent = "A senha é obrigatória.";
        passwordError.style.display = 'block';
        isValid = false;
      }

      if (!isValid) {
        return;
      }

      loginBtn.disabled = true;
      loginText.style.display = 'none';
      loginSpinner.style.display = 'inline-block';

      try {
        if (isEmail) {
          await firebaseAuth.loginWithEmail(emailOrPhone, passwordInput.value);
        } else if (isPhone) {
          // Para login por telefone, você precisará de uma etapa de OTP
          // A senha não é usada diretamente para autenticação com telefone no Firebase,
          // mas pode ser usada para um registro inicial
          // A autenticação por telefone no Firebase envolve o envio de um código de verificação
          // E uma nova tela para inserção desse código.
          // window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('loginBtn', { // 'loginBtn' é o ID do elemento onde o reCAPTCHA será renderizado ou onde o botão é clicado
          //   'size': 'invisible',
          //   'callback': (response) => {
          //     // reCAPTCHA resolvido, agora você pode enviar o código de verificação
          //   }
          // });
          // const appVerifier = window.recaptchaVerifier;
          // await firebaseAuth.loginWithPhone(emailOrPhone, appVerifier);
          // Redirecionar para tela de verificação de OTP
          alert('Será enviado um código para o seu número de telefone.');
          // Armazenar o número de telefone para a próxima tela
          localStorage.setItem('pendingVerificationPhoneNumber', emailOrPhone);
          window.location.href = 'verify-phone.html'; 

        }
        alert('Login realizado com sucesso! Você será redirecionado.');
        window.location.href = 'dashboard.html';
      } catch (error) {
        alert('Erro ao fazer login: ' + error.message);
        console.error("Erro ao fazer login:", error);
        loginBtn.disabled = false;
        loginText.style.display = 'inline';
        loginSpinner.style.display = 'none';
      }
    });

    googleLoginBtn.addEventListener('click', async () => {
      try {
        await firebaseAuth.loginWithGoogle();
        alert('Login com Google realizado com sucesso! Você será redirecionado.');
        window.location.href = 'dashboard.html';
      } catch (error) {
        alert('Erro ao fazer login com Google: ' + error.message);
        console.error("Erro ao fazer login com Google:", error);
      }
    });

    forgotPasswordLink.addEventListener('click', async (e) => {
      e.preventDefault();
      const emailInputVal = emailOrPhoneInput.value.trim(); // Assume que se usou email, vai querer resetar por email
      if (!emailInputVal || !emailInputVal.includes('@')) {
        alert('Por favor, digite seu email no campo acima para resetar a senha.');
        return;
      }
      try {
        await firebaseAuth.resetPassword(emailInputVal);
        alert('Um email para redefinição de senha foi enviado para ' + emailInputVal);
      } catch (error) {
        alert('Erro ao resetar senha: ' + error.message);
        console.error("Erro ao resetar senha:", error);
      }
    });
  </script>
</body>
</html>
