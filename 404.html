<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página não encontrada - FixABairro.">
  <meta name="keywords" content="404, página não encontrada, erro, fixabairro, angola">
  <meta name="author" content="FixABairro Team">
  <title>FixABairro | Página Não Encontrada</title>
  
  <!-- Favicon (Usando um placeholder) -->
  <link rel="icon" type="image/png" href="https://placehold.co/32x32/FF5722/FFFFFF?text=F"/>

  <!-- Google Fonts: Poppins para corpo, Montserrat para títulos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS (direto do CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    @layer base {
      /* Paleta de Cores e Variáveis Globais (Mantendo as mesmas do seu tema principal) */
      :root {
        --primary-accent: #FF5722; /* Laranja VIBRANTE e único para CTA e destaque */
        --secondary-dark: #2C3E50; /* Azul escuro profundo para seções, texto principal e footer */
        --highlight-light: #FFC107; /* Amarelo ouro para ícones de processos e atenção */
        --success-green: #4CAF50; /* Verde para status de sucesso */
        --warning-orange: #FF9800; /* Laranja suave para status de aviso/pendente */
        --info-blue: #2196F3; /* Azul para status de informação/progresso */

        --bg-light: #F8F9FA; /* Fundo muito claro para seções de conteúdo */
        --bg-white: #FFFFFF; /* Fundo branco puro para cards */
        --bg-dark-overlay: rgba(0, 0, 0, 0.7); /* Overlay escuro para hero */

        --text-main: #34495E; /* Azul escuro para texto principal */
        --text-secondary: #7F8C8D; /* Cinza para texto secundário */
        --text-white: #FFFFFF; /* Texto branco */

        --font-heading: 'Montserrat', sans-serif; /* Fonte para títulos maiores */
        --font-body: 'Poppins', sans-serif; /* Fonte para corpo de texto */

        --border-radius-lg: 15px;
        --border-radius-md: 10px;
        --shadow-soft: 0 4px 20px rgba(0,0,0,0.08);
        --shadow-medium: 0 8px 30px rgba(0,0,0,0.1);
        --error-red: #DC3545; /* Vermelho para erros */
      }
      
      /* Reset e estilos base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: var(--font-body);
        background: var(--bg-light); /* Fundo claro da paleta */
        color: var(--text-main); /* Cor de texto principal da paleta */
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        color: var(--secondary-dark); /* Cor de título da paleta */
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
          width: 8px;
      }
      ::-webkit-scrollbar-track {
          background: var(--bg-light);
      }
      ::-webkit-scrollbar-thumb {
          background: var(--primary-accent);
          border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
          background: #E64A19;
      }

      /* Botão principal (replicado do seu tema) */
      .btn-main {
        background: var(--primary-accent);
        color: var(--text-white);
        padding: 0.9rem 2.5rem;
        border-radius: 30px; /* Mais arredondado */
        font-weight: 600;
        font-size: 1.1rem;
        text-decoration: none;
        border: none;
        display: inline-block;
        box-shadow: 0 8px 25px rgba(255, 87, 34, 0.4);
        transition: all 0.3s ease;
      }

      .btn-main:hover {
        background: #E64A19;
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(255, 87, 34, 0.5);
      }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              accent: 'var(--primary-accent)',
            },
            secondary: {
              dark: 'var(--secondary-dark)',
            },
            highlight: {
              light: 'var(--highlight-light)',
            },
            success: {
              DEFAULT: 'var(--success-green)',
            },
            warning: {
              DEFAULT: 'var(--warning-orange)',
            },
            info: {
              DEFAULT: 'var(--info-blue)',
            },
            bg: {
              light: 'var(--bg-light)',
              white: 'var(--bg-white)',
              darkOverlay: 'var(--bg-dark-overlay)',
            },
            text: {
              main: 'var(--text-main)',
              secondary: 'var(--text-secondary)',
              white: 'var(--text-white)',
            },
            error: 'var(--error-red)',
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            montserrat: ['Montserrat', 'sans-serif'],
          },
          borderRadius: {
            'lg': 'var(--border-radius-lg)',
            'md': 'var(--border-radius-md)',
          },
          boxShadow: {
            soft: 'var(--shadow-soft)',
            medium: 'var(--shadow-medium)',
          },
        }
      }
    }
  </script>
</head>
<body class="bg-light text-main">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-medium p-8 border border-[#ECEFF1] text-center transition-all duration-300 hover:shadow-lg hover:border-primary-accent">
      
      <div class="w-20 h-20 bg-primary-accent rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg transform transition-transform duration-300 hover:scale-110">
        <i class="fas fa-exclamation-triangle text-4xl text-white"></i> <!-- Ícone de exclamação para erro -->
      </div>

      <h1 class="text-6xl font-montserrat font-extrabold text-secondary-dark mb-4">404</h1>
      <h2 class="text-3xl font-montserrat font-bold text-primary-accent mb-4">Página Não Encontrada</h2>
      
      <p class="text-text-main text-lg mb-8">
        Ops! Parece que a página que você procura não existe ou foi movida.
        Por favor, verifique o endereço e tente novamente, ou volte para a página inicial.
      </p>

      <a href="index.html" class="inline-flex items-center justify-center btn-main text-white py-3 px-8 rounded-full font-semibold text-lg hover:bg-[#E64A19] focus:outline-none focus:ring-2 focus:ring-primary-accent focus:ring-offset-2 focus:ring-offset-bg-white transition-all duration-200 shadow-md transform hover:-translate-y-1">
        <i class="fas fa-home mr-3"></i> Voltar para a Página Inicial
      </a>
    </div>
  </div>
</body>
</html>
