<body class="bg-background flex items-center justify-center min-h-screen">
  <div class="form-card max-w-md">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-primary-accent rounded-full flex items-center justify-center mx-auto mb-4 shadow-medium">
        <i class="fas fa-sms text-2xl text-white"></i>
      </div>
      <h1 class="section-title">Verifique Seu Telefone</h1>
      <p class="text-text-secondary text-base">
        Um código de 6 dígitos foi enviado para <strong class="text-text-main" id="phoneNumberDisplay">seu número</strong> via WhatsApp. Insira-o abaixo.
      </p>
    </div>
    
    <form id="verifyPhoneForm" class="space-y-6">
      <div class="form-group">
        <label for="verificationCode" class="sr-only">Código de Verificação</label>
        <input type="text" id="verificationCode" class="form-control" placeholder="______" required maxlength="6" pattern="\d{6}" title="Digite 6 dígitos numéricos" aria-describedby="codeError">
        <p id="codeError" class="error-message">Código inválido.</p>
      </div>
      
      <button type="submit" id="verifyBtn" class="btn-main flex items-center justify-center gap-2">
        <span id="verifyText"><i class="fas fa-check-circle mr-2"></i> Verificar Código</span>
        <span id="verifySpinner" class="spinner-border spinner-border-sm hidden" role="status" aria-hidden="true"></span>
      </button>

      <button type="button" id="resendCodeBtn" class="btn-secondary flex items-center justify-center gap-2 mt-4">
        <span id="resendText"><i class="fas fa-redo mr-2"></i> Reenviar Código</span>
        <span id="resendSpinner" class="spinner-border spinner-border-sm hidden" role="status" aria-hidden="true"></span>
      </button>
      
      <p class="text-center text-text-secondary text-sm mt-6">
        Voltar ao 
        <a href="login.html" class="text-primary hover:underline font-medium">Login</a>
      </p>
    </form>

    <div id="recaptcha-container" class="mt-4 hidden"></div>
  </div>

  <div id="notificationModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-body">
        <i id="notificationIcon" class="fas"></i>
        <p id="notificationMessage" class="text-lg font-semibold text-text-main"></p>
      </div>
      <div class="modal-footer">
        <button id="closeNotificationModal" class="btn-main">Ok</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://unpkg.com/imask"></script>

  <script src="js/config.js"></script>
  <script src="js/firebaseAuth.js"></script>
  <script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    window.firebaseAuth.initializeFirebaseApp(window.firebaseConfig);
  } catch (error) {
    console.error("Erro ao inicializar Firebase:", error);
    showNotification('error', 'Erro ao carregar o sistema. Tente novamente.');
    return;
  }

  const verifyPhoneForm = document.getElementById('verifyPhoneForm');
  const verificationCodeInput = document.getElementById('verificationCode');
  const verifyBtn = document.getElementById('verifyBtn');
  const verifyText = document.getElementById('verifyText');
  const verifySpinner = document.getElementById('verifySpinner');
  const resendCodeBtn = document.getElementById('resendCodeBtn');
  const resendText = document.getElementById('resendText');
  const resendSpinner = document.getElementById('resendSpinner');
  const codeError = document.getElementById('codeError');
  const phoneNumberDisplay = document.getElementById('phoneNumberDisplay');
  const notificationModal = document.getElementById('notificationModal');
  const notificationIcon = document.getElementById('notificationIcon');
  const notificationMessage = document.getElementById('notificationMessage');
  const closeNotificationModal = document.getElementById('closeNotificationModal');

  if (typeof IMask !== 'undefined') {
    IMask(verificationCodeInput, {
      mask: '000000',
      lazy: false,
    });
  } else {
    console.error("IMask não está carregado. Verifique o script.");
  }

  // Obter o userId e o phoneNumber do localStorage
  const userId = localStorage.getItem('pendingVerificationUserId');
  const storedPhoneNumber = localStorage.getItem('pendingVerificationPhoneNumber');

  if (!userId || !storedPhoneNumber) {
    showNotification('error', 'Dados de verificação não encontrados. Retorne ao cadastro.');
    setTimeout(() => {
      window.location.href = 'register.html';
    }, 2000);
    return;
  }

  phoneNumberDisplay.textContent = storedPhoneNumber;

  // Verificar se o usuário está logado
  window.firebaseAuth.onAuthStateChangedListener((user) => {
    if (!user || user.uid !== userId) {
      showNotification('error', 'Sessão inválida. Faça o registro novamente.');
      setTimeout(() => {
        window.location.href = 'register.html';
      }, 2000);
    }
  });

  function showNotification(type, message) {
    notificationIcon.className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;
    notificationModal.classList.remove('success', 'error');
    notificationModal.classList.add(type);
    notificationMessage.textContent = message;
    notificationModal.classList.add('show');
  }

  function hideNotification() {
    notificationModal.classList.remove('show', 'success', 'error');
  }

  function showError(element, message) {
    element.textContent = message;
    element.style.display = 'block';
    const inputElement = element.parentElement.querySelector('input');
    if (inputElement) {
      inputElement.setAttribute('aria-invalid', 'true');
      inputElement.classList.add('border-error');
    }
  }

  function hideError(element) {
    element.style.display = 'none';
    const inputElement = element.parentElement.querySelector('input');
    if (inputElement) {
      inputElement.setAttribute('aria-invalid', 'false');
      inputElement.classList.remove('border-error');
    }
  }

  // Função para enviar código de verificação via WhatsApp
  async function sendWhatsAppVerificationCode(phoneNumber) {
    const verificationCode = Math.floor(100000 + Math.random() * 900000).toString();
    const ULTRA_MSG_TOKEN = 'dklefhlqae1key9l'; // MOVER PARA BACKEND EM PRODUÇÃO
    const ULTRA_MSG_INSTANCE_ID = 'instance126366';

    try {
      const response = await fetch(`https://api.ultramsg.com/${ULTRA_MSG_INSTANCE_ID}/messages/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: ULTRA_MSG_TOKEN,
          to: phoneNumber.replace(/\s/g, ''),
          body: `Seu código de verificação FixABairro é: ${verificationCode}`
        })
      });
      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(`Falha ao enviar código: ${errorData.error || 'Erro desconhecido'}`);
      }
      return verificationCode;
    } catch (error) {
      console.error('Erro ao enviar código via UltraMsg:', error);
      throw error;
    }
  }

  // Evento de submissão do formulário
  verifyPhoneForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (verifyBtn.disabled) return;

    hideError(codeError);
    const code = verificationCodeInput.value.trim();
    if (code.length !== 6 || !/^\d{6}$/.test(code)) {
      showError(codeError, 'O código deve ter 6 dígitos numéricos.');
      return;
    }

    verifyBtn.disabled = true;
    verifyText.classList.add('hidden');
    verifySpinner.classList.remove('hidden');
    verifyBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> A verificar...`;

    try {
      // Verificar o código usando a nova função
      await window.firebaseAuth.verifyPhoneCode(userId, code);

      // Limpar dados do localStorage
      localStorage.removeItem('pendingVerificationUserId');
      localStorage.removeItem('pendingVerificationPhoneNumber');

      showNotification('success', 'Telefone verificado com sucesso! Bem-vindo(a) ao FixABairro.');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 2000);
    } catch (error) {
      console.error('Erro ao verificar código:', error);
      showError(codeError, error.message || 'Erro ao verificar código. Tente novamente.');
    } finally {
      verifyBtn.disabled = false;
      verifyText.classList.remove('hidden');
      verifySpinner.classList.add('hidden');
      verifyBtn.innerHTML = `<i class="fas fa-check-circle mr-2"></i> Verificar Código`;
    }
  });

  // Evento de reenvio do código
  resendCodeBtn.addEventListener('click', async () => {
    if (resendCodeBtn.disabled) return;

    resendCodeBtn.disabled = true;
    resendText.classList.add('hidden');
    resendSpinner.classList.remove('hidden');
    resendCodeBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> A reenviar...`;
    hideError(codeError);

    try {
      const verificationCode = await sendWhatsAppVerificationCode(storedPhoneNumber);
      const verificationDocRef = firebase.firestore().collection('phoneVerifications').doc(userId);
      await verificationDocRef.update({
        verificationCode,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      showNotification('success', 'Novo código enviado para o seu WhatsApp.');
    } catch (error) {
      console.error('Erro ao reenviar código:', error);
      showError(codeError, error.message || 'Erro ao reenviar código. Tente novamente.');
    } finally {
      resendCodeBtn.disabled = false;
      resendText.classList.remove('hidden');
      resendSpinner.classList.add('hidden');
      resendCodeBtn.innerHTML = `<i class="fas fa-redo mr-2"></i> Reenviar Código`;
    }
  });

  closeNotificationModal.addEventListener('click', hideNotification);
  notificationModal.addEventListener('click', (e) => {
    if (e.target === notificationModal) {
      hideNotification();
    }
  });
});
  </script>
</body>
</html>
