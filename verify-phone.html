<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FixABairro - Verifique seu número de telefone para continuar com a autenticação.">
    <meta name="keywords" content="fixabairro, angola, verificação de telefone, otp, login">
    <meta name="author" content="FixABairro Team">
    <title>FixABairro | Verificar Telefone</title>
    
    <link rel="icon" type="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80" width="32" height="32"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@700;800&family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --primary-accent: #FF5722;
                --secondary-dark: #2C3E50;
                --highlight-light: #FFC107;
                --success-green: #4CAF50;
                --warning-orange: #FF9800;
                --info-blue: #2196F3;
                --bg-light: #F8F9FA;
                --bg-white: #FFFFFF;
                --bg-dark-overlay: rgba(0,0,0,0.6);
                --text-main: #34495E;
                --text-secondary: #7F8C8D;
                --text-white: #FFFFFF;
                --font-heading: 'Montserrat', sans-serif;
                --font-body: 'Poppins', sans-serif;
                --border-radius-lg: 15px;
                --border-radius-md: 10px;
                --shadow-soft: 0 4px 20px rgba(0,0,0,0.08);
                --shadow-medium: 0 8px 30px rgba(0,0,0,0.1);
                --error-red: #DC3545;
            }
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            
            body {
                font-family: var(--font-body);
                background: var(--bg-light);
                color: var(--text-main);
                line-height: 1.7;
                overflow-x: hidden;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            
            h1, h2, h3, h4, h5, h6 {
                font-family: var(--font-heading);
                color: var(--secondary-dark);
                line-height: 1.2;
            }

            ::-webkit::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit::-webkit-scrollbar-track {
                background: var(--bg-light);
            }
            ::-webkit::-webkit-scrollbar {
                background: var(--primary-accent);
                border-radius: 4px;
            }
            ::-webkit::-webkit::-webkit-scrollbar {
                background: #E64A19;
            }

            .navbar {
                background: var(--secondary-dark);
                padding: 0.8rem 0;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1);
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 100;
                transition: all 0.4s ease-in-out;
            }

            .navbar-brand {
                font-size: 1.8rem;
                font-weight: 700;
                color: var(--text-white);
                display: flex;
                align-items: center;
                text-decoration: none;
                transition: color 0.3s ease-in-out;
            }

            .logo {
                width: 40px;
                height: 40px;
                margin-right: 10px;
                background: var(--primary-accent);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-white);
                font-size: 1.5rem;
                font-weight: 700;
                box-shadow: 0 2px 10px rgba(255, 87, 34, 0.4);
            }

            .form-container-wrapper {
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 0;
                margin-top: 80px;
            }

            .form-card {
                background: var(--bg-white);
                border-radius: var(--border-radius-lg);
                padding: 3rem;
                box-shadow: var(--shadow-medium);
                border: 1px solid #ECEFF1;
                transition: all 0.4s ease;
                width: 100%;
                max-width: 500px;
            }
            
            .form-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 12px 40px rgba(0,0,0,0.12);
            }
            
            .form-control {
                background: var(--bg-light);
                border: 1px solid #CED4DA;
                border-radius: var(--border-radius-md);
                padding: var(--padding) 0.9rem 1.2rem;
                color: var(--text-main);
                transition: all 0.3s ease-in-out;
                font-size: 1rem;
            }
            
            .form-control:focus {
                background: var(--bg-white);
                border-color: var(--primary-accent);
                box-shadow: 0 0 0 0.2rem rgba(255, 87, 34, 0.25);
                color: var(--text-main);
            }
            
            .form-control::-webkit::placeholder {
                color: var(--text-secondary);
                opacity: 0.7;
            }
            
            .error-message {
                color: var(--error-red);
                font-size: 0.9rem;
                margin-top: 0.5rem;
                display: none;
                font-weight: 500;
            }

            .notification-message {
                padding: 0.75rem 1rem;
                border-radius: 0.5rem;
                font-weight: 500;
                text-align: center;
                margin-top: 1rem;
                border: 1px solid;
            }
            .notification-message.success {
                background-color: #d1fae5;
                color: #065f46;
                border-color: #34d399;
            }
            .notification-message.error {
                background-color: #fee2e2;
                color: #991b1b;
                border-color: #f87171;
            }

            .btn-main {
                background: var(--primary-accent);
                color: var(--text-white);
                padding: 0.9rem 2.5rem;
                border-radius: 30px;
                font-weight: 600;
                font-size: 1.1rem;
                text-decoration: none;
                border: none;
                display: inline-block;
                box-shadow: 0 8px 25px rgba(255, 87, 34, 0.4);
                transition: all 0.3s ease;
            }

            .btn-main:hover {
                background: #E64A19;
                transform: translateY(-3px);
                box-shadow: 0 12px 30px rgba(255, 87, 34, 0.5);
            }

            .spinner-border {
                display: inline-block;
                width: 1.25rem;
                height: 1.25rem;
                vertical-align: -0.125em;
                border: 0.25em solid currentColor;
                border-right-color: transparent;
                border-radius: 50%;
                animation: .75s linear infinite spinner-border;
            }
            @keyframes spinner-border {
                to { transform: rotate(360deg); }
            }
            .spinner-border-sm {
                width: 1rem;
                height: 1rem;
                border-width: 0.2em;
            }

            @media (max-width: 768px) {
                .form-card {
                    padding: 2rem;
                }
            }
            
            @media (max-width: 576px) {
                .form-card {
                    padding: 1.5rem;
                }
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { accent: 'var(--primary-accent)' },
                        secondary: { dark: 'var(--secondary-dark)' },
                        highlight: { light: 'var(--highlight-light)' },
                        success: { DEFAULT: 'var(--success-green)' },
                        warning: { DEFAULT: 'var(--warning-orange)' },
                        info: { DEFAULT: 'var(--info-blue)' },
                        bg: { light: 'var(--bg-light)', white: 'var(--bg-white)', darkOverlay: 'var(--bg-dark-overlay)' },
                        text: { main: 'var(--text-main)', secondary: 'var(--text-secondary)', white: 'var(--text-white)' },
                        error: 'var(--error-red)',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        montserrat: ['Montserrat', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    borderRadius: { 'lg': 'var(--border-radius-lg)', 'md': 'var(--border-radius-md)' },
                    boxShadow: { soft: 'var(--shadow-soft)', medium: 'var(--shadow-medium)' },
                }
            }
        }
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container mx-auto px-4">
            <a class="navbar-brand flex items-center" href="index.html">
                <div class="logo">F</div>
                FixABairro
            </a>
        </div>
    </nav>

    <div class="form-container-wrapper w-full px-4">
        <div class="form-card">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary-accent rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-mobile-alt text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-montserrat font-bold text-secondary-dark">Verificar Telefone</h1>
                <p class="text-text-secondary text-sm mt-2">Insira o código OTP enviado para seu telefone.</p>
            </div>
            
            <div id="notificationMessage" class="notification-message hidden" role="alert"></div>

            <form id="verifyPhoneForm" class="space-y-5">
                <div>
                    <label for="otpCode" class="block text-text-main text-sm font-medium mb-1">Código OTP</label>
                    <input type="text" id="otpCode" class="w-full p-3 rounded-lg bg-bg-light border border-[#CED4DA] text-text-main placeholder-text-secondary focus:ring-2 focus:ring-primary-accent focus:border-primary-accent transition-all duration-200" placeholder="Digite o código de 6 dígitos" required>
                    <p id="otpError" class="error-message">Erro no código OTP</p>
                </div>
                
                <button type="submit" id="verifyBtn" class="w-full bg-primary-accent text-white p-3 rounded-lg font-semibold text-lg hover:bg-[#E64A19] focus:outline-none focus:ring-2 focus:ring-primary-accent focus:ring-offset-2 focus:ring-offset-bg-white transition-all duration-200 shadow-md flex items-center justify-center gap-2">
                    <span id="verifyText"><i class="fas fa-check-circle"></i> Verificar</span>
                    <span id="verifySpinner" class="spinner-border spinner-border-sm hidden" role="status" aria-hidden="true"></span>
                </button>
            </form>
            
            <p class="text-center text-text-secondary text-sm mt-6">
                Não recebeu o código? 
                <a href="#" id="resendCode" class="text-primary-accent hover:underline font-medium">Reenviar código</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/imask@7.6.1/dist/imask.min.js"></script>
    <script src="js/firebaseAuth.js"></script>
    <script src="js/verify-phone.js"></script>
</body>
</html>
