<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Verifique seu email para ativar sua conta no FixABairro. Clique no link enviado para seu Gmail.">
  <meta name="keywords" content="fixabairro, angola, verificação, email, gmail, ativação">
  <meta name="author" content="FixABairro Team">
  <meta property="og:title" content="FixABairro | Verificar Email">
  <meta property="og:description" content="Clique no link de verificação enviado para seu Gmail e ative sua conta no FixABairro.">
  <meta property="og:image" content="https://placehold.co/1200x630/F4511E/FFFFFF?text=FixABairro">
  <meta property="og:url" content="https://fixabairro.co.ao/verify-email.html">
  <title>FixABairro | Verificar Email</title>
  
  <link rel="icon" type="image/png" href="https://placehold.co/32x32/F4511E/FFFFFF?text=F"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style type="text/tailwindcss">
    @layer base {
      :root {
        --primary-accent: #F4511E;
        --secondary-dark: #1A2A44;
        --success-green: #28A745;
        --error-red: #DC3545;
        --bg-light: #F9FAFB;
        --bg-white: #FFFFFF;
        --bg-dark-overlay: rgba(0, 0, 0, 0.75);
        --text-main: #1F2A44;
        --text-secondary: #6B7280;
        --text-white: #FFFFFF;
        --font-heading: 'Roboto', sans-serif;
        --font-body: 'Open Sans', sans-serif;
        --border-radius-lg: 12px;
        --border-radius-md: 8px;
        --shadow-soft: 0 4px 12px rgba(0,0,0,0.1);
        --shadow-medium: 0 6px 20px rgba(0,0,0,0.15);
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: var(--font-body);
        background: var(--bg-light);
        color: var(--text-main);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        color: var(--secondary-dark);
        line-height: 1.3;
      }

      ::-webkit-scrollbar {
          width: 8px;
      }
      ::-webkit-scrollbar-track {
          background: var(--bg-light);
      }
      ::-webkit-scrollbar-thumb {
          background: var(--primary-accent);
          border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
          background: #D84315;
      }

      .form-card {
        background: var(--bg-white);
        border-radius: var(--border-radius-lg);
        padding: 2.5rem;
        box-shadow: var(--shadow-medium);
        border: 1px solid #E5E7EB;
        transition: all 0.3s ease;
        width: 100%;
        max-width: 480px;
      }
      
      .form-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      }
      
      .section-title {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--secondary-dark);
        margin-bottom: 1rem;
        text-align: center;
      }
      
      .btn-main {
        background: var(--primary-accent);
        color: var(--text-white);
        padding: 0.75rem 2rem;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        border: none;
        display: inline-block;
        box-shadow: var(--shadow-soft);
        transition: all 0.3s ease;
        width: 100%;
      }

      .btn-main:hover {
        background: #D84315;
        transform: translateY(-2px);
        box-shadow: var(--shadow-medium);
      }

      .btn-secondary {
        background: var(--bg-light);
        color: var(--text-main);
        padding: 0.75rem 2rem;
        border: 1px solid #D1D5DB;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        text-decoration: none;
        display: inline-block;
        transition: all 0.3s ease;
        width: 100%;
      }

      .btn-secondary:hover {
        background: #E5E7EB;
        transform: translateY(-2px);
      }

      .spinner-border {
        display: inline-block;
        width: 1.25rem;
        height: 1.25rem;
        vertical-align: -0.125em;
        border: 0.25em solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: .75s linear infinite spinner-border;
      }
      @keyframes spinner-border {
        to { transform: rotate(360deg); }
      }

      .modal-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: var(--bg-dark-overlay);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1050;
          opacity: 0;
          visibility: hidden;
          transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .modal-overlay.show {
          opacity: 1;
          visibility: visible;
      }

      .modal-content {
          background: var(--bg-white);
          border-radius: var(--border-radius-lg);
          padding: 2rem;
          max-width: 500px;
          width: 90%;
          max-height: 90vh;
          box-shadow: var(--shadow-medium);
          transform: translateY(20px);
          transition: transform 0.3s ease;
      }
      .modal-overlay.show .modal-content {
          transform: translateY(0);
      }

      .modal-body {
        text-align: center;
        padding: 1.5rem;
      }
      .modal-body i {
        font-size: 2.5rem;
        margin-bottom: 1rem;
      }
      .modal-body.success i {
        color: var(--success-green);
      }
      .modal-body.error i {
        color: var(--error-red);
      }

      .modal-footer {
        text-align: center;
        padding-top: 1rem;
      }
      .modal-footer button {
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 50px;
      }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { accent: 'var(--primary-accent)' },
            secondary: { dark: 'var(--secondary-dark)' },
            success: { DEFAULT: 'var(--success-green)' },
            error: { DEFAULT: 'var(--error-red)' },
            bg: {
              light: 'var(--bg-light)',
              white: 'var(--bg-white)',
              darkOverlay: 'var(--bg-dark-overlay)',
            },
            text: {
              main: 'var(--text-main)',
              secondary: 'var(--text-secondary)',
              white: 'var(--text-white)',
            },
          },
          fontFamily: {
            roboto: ['Roboto', 'sans-serif'],
            opensans: ['Open Sans', 'sans-serif'],
          },
          borderRadius: {
            'lg': 'var(--border-radius-lg)',
            'md': 'var(--border-radius-md)',
          },
          boxShadow: {
            soft: 'var(--shadow-soft)',
            medium: 'var(--shadow-medium)',
          },
        }
      }
    }
  </script>
</head>
<body>
  <div class="form-card">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-primary-accent rounded-full flex items-center justify-center mx-auto mb-4 shadow-md">
        <i class="fas fa-envelope text-2xl text-white"></i>
      </div>
      <h1 class="section-title">Verifique Seu Email</h1>
      <p class="text-text-secondary text-sm">
        Um link de verificação foi enviado para <strong class="text-text-main" id="emailDisplay">seu email</strong>. Clique no link para ativar sua conta.
      </p>
    </div>
    
    <div class="space-y-4">
      <button id="resendEmail" class="btn-main flex items-center justify-center gap-2">
        <span id="resendText"><i class="fas fa-redo"></i> Reenviar Email</span>
        <span id="resendSpinner" class="spinner-border hidden" role="status" aria-hidden="true"></span>
      </button>
      
      <button id="checkVerification" class="btn-secondary flex items-center justify-center gap-2">
        <span id="checkText"><i class="fas fa-check-circle"></i> Já Verifiquei</span>
        <span id="checkSpinner" class="spinner-border hidden" role="status" aria-hidden="true"></span>
      </button>
      
      <p class="text-center text-text-secondary text-sm mt-4">
        Voltar ao 
        <a href="login.html" class="text-primary-accent hover:underline font-medium">Login</a>
      </p>
    </div>
  </div>

  <div id="notificationModal" class="modal-overlay notification-modal">
    <div class="modal-content">
      <div class="modal-body">
        <i id="notificationIcon" class="fas"></i>
        <p id="notificationMessage"></p>
      </div>
      <div class="modal-footer">
        <button id="closeNotificationModal" class="btn-main">Fechar</button>
      </div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/firebaseAuth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Inicializa Firebase
      try {
        window.firebaseAuth.initializeFirebaseApp(firebaseConfig);
      } catch (error) {
        console.error("Erro ao inicializar Firebase:", error);
        showNotification('error', 'Erro ao carregar o sistema. Tente novamente.');
        return;
      }

      const auth = firebase.auth();
      const emailDisplay = document.getElementById('emailDisplay');
      const resendEmail = document.getElementById('resendEmail');
      const resendText = document.getElementById('resendText');
      const resendSpinner = document.getElementById('resendSpinner');
      const checkVerification = document.getElementById('checkVerification');
      const checkText = document.getElementById('checkText');
      const checkSpinner = document.getElementById('checkSpinner');
      const notificationModal = document.getElementById('notificationModal');
      const notificationIcon = document.getElementById('notificationIcon');
      const notificationMessage = document.getElementById('notificationMessage');
      const closeNotificationModal = document.getElementById('closeNotificationModal');

      // Recupera email
      const storedEmail = localStorage.getItem('pendingVerificationEmail');
      if (storedEmail) {
        emailDisplay.textContent = storedEmail;
      } else if (auth.currentUser?.email) {
        emailDisplay.textContent = auth.currentUser.email;
        localStorage.setItem('pendingVerificationEmail', auth.currentUser.email);
      } else {
        showNotification('error', 'Email não encontrado. Retorne ao cadastro.');
        setTimeout(() => {
          window.location.href = 'register.html';
        }, 2000);
        return;
      }

      function showNotification(type, message) {
        notificationIcon.className = `fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}`;
        notificationModal.classList.add(type);
        notificationMessage.textContent = message;
        notificationModal.classList.add('show');
      }

      function hideNotification() {
        notificationModal.classList.remove('show', 'success', 'error');
      }

      closeNotificationModal.addEventListener('click', hideNotification);
      notificationModal.addEventListener('click', (e) => {
        if (e.target === notificationModal) {
          hideNotification();
        }
      });

      resendEmail.addEventListener('click', async () => {
        if (resendEmail.disabled) return;

        resendEmail.disabled = true;
        resendText.classList.add('hidden');
        resendSpinner.classList.remove('hidden');
        resendEmail.innerHTML = `<span class="spinner-border" role="status" aria-hidden="true"></span> A reenviar...`;

        try {
          if (!auth.currentUser) {
            throw new Error('Usuário não autenticado. Faça o cadastro novamente.');
          }
          await auth.currentUser.sendEmailVerification();
          showNotification('success', 'Email de verificação reenviado!');
        } catch (error) {
          console.error('Erro ao reenviar email:', error);
          showNotification('error', error.message || 'Erro ao reenviar email. Tente novamente.');
        } finally {
          resendEmail.disabled = false;
          resendText.classList.remove('hidden');
          resendSpinner.classList.add('hidden');
          resendEmail.innerHTML = `<i class="fas fa-redo"></i> Reenviar Email`;
        }
      });

      checkVerification.addEventListener('click', async () => {
        if (checkVerification.disabled) return;

        checkVerification.disabled = true;
        checkText.classList.add('hidden');
        checkSpinner.classList.remove('hidden');
        checkVerification.innerHTML = `<span class="spinner-border" role="status" aria-hidden="true"></span> A verificar...`;

        try {
          if (!auth.currentUser) {
            throw new Error('Usuário não autenticado. Faça o cadastro novamente.');
          }
          await auth.currentUser.reload();
          if (auth.currentUser.emailVerified) {
            localStorage.removeItem('pendingVerificationEmail');
            showNotification('success', 'Email verificado com sucesso! Bem-vindo(a) ao FixABairro.');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 2000);
          } else {
            showNotification('error', 'Email ainda não verificado. Clique no link enviado.');
          }
        } catch (error) {
          console.error('Erro ao verificar email:', error);
          showNotification('error', error.message || 'Erro ao verificar email. Tente novamente.');
        } finally {
          checkVerification.disabled = false;
          checkText.classList.remove('hidden');
          checkSpinner.classList.add('hidden');
          checkVerification.innerHTML = `<i class="fas fa-check-circle"></i> Já Verifiquei`;
        }
      });
    });
  </script>
</body>
</html>
