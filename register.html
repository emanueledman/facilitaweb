<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro e Login FixABairro</title>
    <link rel="stylesheet" href="/cadastro.css">
</head>
<body>
    <div class="container">
        <div class="form-card" id="register-form-card">
            <h2>Cadastre-se na FixABairro</h2>
            <form id="register-form">
                <div class="input-group">
                    <label for="reg-name">Nome Completo:</label>
                    <input type="text" id="reg-name" placeholder="Seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="reg-password">Senha:</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div class="input-group">
                    <label for="reg-confirm-password">Confirmar Senha:</label>
                    <input type="password" id="reg-confirm-password" required>
                </div>

                <div class="input-group">
                    <label for="reg-municipio">Município:</label>
                    <input type="text" id="reg-municipio" placeholder="Seu município" required>
                </div>
                <div class="input-group">
                    <label for="reg-bairro">Bairro:</label>
                    <input type="text" id="reg-bairro" placeholder="Seu bairro" required>
                </div>

                <div class="input-group">
                    <label>Como deseja se cadastrar e receber notificações?</label>
                    <div class="radio-group">
                        <input type="radio" id="method-email" name="reg-method" value="email" checked>
                        <label for="method-email">Gmail</label>
                        <input type="radio" id="method-phone" name="reg-method" value="phone">
                        <label for="method-phone">Número de Telefone (WhatsApp)</label>
                    </div>
                </div>

                <div class="input-group" id="email-fields">
                    <label for="reg-email">Gmail:</label>
                    <input type="email" id="reg-email" placeholder="seuemail@gmail.com">
                </div>

                <div class="input-group hidden" id="phone-fields">
                    <label for="reg-phone">Número de Telefone (WhatsApp):</label>
                    <input type="tel" id="reg-phone" placeholder="+244 9XX XXX XXX">
                    <small>Ex: +244 923 123 456 (Formato internacional, para WhatsApp)</small>
                </div>

                <button type="submit">Cadastrar</button>
                <p class="message" id="register-message"></p>
            </form>
            <p>Já tem uma conta? <a href="#" id="show-login">Faça Login</a></p>
            <button id="google-login-button">Entrar com Google</button>
            <p class="message" id="google-login-message"></p>
        </div>

        <div class="form-card hidden" id="login-form-card">
            <h2>Login na FixABairro</h2>
            <form id="login-form">
                <div class="input-group">
                    <label for="login-type">Tipo de Login:</label>
                    <div class="radio-group">
                        <input type="radio" id="login-email-radio" name="login-type" value="email" checked>
                        <label for="login-email-radio">Email</label>
                        <input type="radio" id="login-phone-radio" name="login-type" value="phone">
                        <label for="login-phone-radio">Telefone</label>
                    </div>
                </div>

                <div class="input-group" id="login-email-fields">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" placeholder="seuemail@gmail.com" required>
                    <label for="login-password">Senha:</label>
                    <input type="password" id="login-password" required>
                </div>

                <div class="input-group hidden" id="login-phone-request-fields">
                    <label for="login-phone">Número de Telefone:</label>
                    <input type="tel" id="login-phone" placeholder="+244 9XX XXX XXX" required>
                    <button type="button" id="request-code-button">Solicitar Código</button>
                </div>

                <div class="input-group hidden" id="login-phone-verify-fields">
                    <label for="verification-code">Código de Verificação:</label>
                    <input type="text" id="verification-code" placeholder="Insira o código" required>
                    <button type="button" id="verify-code-button">Verificar Código e Entrar</button>
                </div>

                <button type="submit" id="main-login-button">Entrar</button>
                <p class="message" id="login-message"></p>
                <p><a href="#" id="forgot-password-link">Esqueceu a senha?</a></p>
            </form>
            <p>Não tem uma conta? <a href="#" id="show-register">Cadastre-se</a></p>
        </div>

        <div class="form-card hidden" id="reset-password-card">
            <h2>Redefinir Senha</h2>
            <form id="reset-password-form">
                <div class="input-group">
                    <label for="reset-email">Email:</label>
                    <input type="email" id="reset-email" placeholder="seuemail@gmail.com" required>
                </div>
                <button type="submit">Redefinir Senha</button>
                <p class="message" id="reset-password-message"></p>
            </form>
            <p><a href="#" id="back-to-login">Voltar ao Login</a></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/firebaseAuth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
